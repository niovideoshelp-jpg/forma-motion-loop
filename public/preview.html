<!doctype html><html lang="en"><meta charset="utf-8"><title>Forma — motion study</title><style>*{box-sizing:border-box}body{margin:0;background:#20211f;color:#eee;font:14px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(86vh,900px)}canvas{width:100%;display:block}footer{display:flex;gap:16px;align-items:center;padding:18px 0}input{flex:1;accent-color:#1ed760}button{background:#eee;color:#111;border:0;border-radius:30px;padding:9px 17px;cursor:pointer}</style><main><canvas id="film"></canvas><footer><button id="play">Play</button><input id="scrub" type="range" min="0" max="21.983333" step="0.0166667" value="0"><output id="time">0.00 / 22</output></footer></main><script type="module">import {loadAssets,createRenderer} from './engine.js';const assets=await loadAssets();const r=createRenderer(document.querySelector('canvas'),assets);window.seek=(t)=>{document.querySelector('#scrub').value=t;document.querySelector('#time').textContent=t.toFixed(2)+' / 22';return r.seek(t)};window.seek(0);window.ready=true;let playing=false,base=0,start=0;const audio=new Audio('./assets/mix.wav');document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';if(playing){base=+document.querySelector('#scrub').value;start=performance.now();audio.currentTime=base;audio.play().catch(()=>{});requestAnimationFrame(tick)}else audio.pause()};document.querySelector('#scrub').oninput=e=>{window.seek(+e.target.value);audio.currentTime=+e.target.value;base=+e.target.value;start=performance.now()};function tick(now){if(!playing)return;const t=(base+(now-start)/1000)%22;window.seek(t);if(Math.abs(audio.currentTime-t)>.2)audio.currentTime=t;requestAnimationFrame(tick)}</script></html>
